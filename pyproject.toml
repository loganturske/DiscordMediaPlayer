[tool.coverage.run]
branch = true
source = ["musicbot", "scripts"]
omit = ["musicbot/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
precision = 1

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
