name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libopus0
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Check code style
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests with branch coverage
        run: python -W error::ResourceWarning -m coverage run -m unittest discover -s tests -v
      - name: Enforce coverage
        run: python -m coverage report
      - name: Generate coverage XML
        if: always()
        run: python -m coverage xml --fail-under=0
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: discord-media-ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and test container dependencies
        run: docker build --target test -t discord-media-player:test .
      - name: Build runtime image
        run: docker compose build
      - name: Verify runtime under Compose restrictions
        run: docker compose run --rm -T bot python -m scripts.container_smoke
      - name: Remove CI containers and synthetic state
        if: always()
        run: docker compose down --volumes --remove-orphans
